name: Compress Background Videos

# Run manually or automatically when the source videos change in the cobblemon repo.
# Downloads the raw source videos, re-encodes them to 1080p H.264 CRF 28 (no audio),
# and uploads/updates the "bg-videos" GitHub Release so the launcher always downloads
# the small pre-compressed copies.
on:
  workflow_dispatch:   # run manually from the Actions tab whenever you update a video

jobs:
  compress:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to create/update the release

    steps:
      - name: Checkout launcher repo
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download source videos from cobblemon repo
        run: |
          mkdir -p bg-source
          for i in 1 2 3; do
            echo "Downloading video_bg${i}_cob.mp4 ..."
            curl -L --fail \
              "https://raw.githubusercontent.com/Kewz4/kewz-cobblemon/main/bg/video_bg${i}_cob.mp4" \
              -o "bg-source/video_bg${i}_cob.mp4"
            SIZE=$(du -sh "bg-source/video_bg${i}_cob.mp4" | cut -f1)
            echo "  → Downloaded ${SIZE}"
          done

      - name: Compress videos (1080p H.264 CRF 28, no audio)
        run: |
          mkdir -p bg-compressed
          for i in 1 2 3; do
            INPUT="bg-source/video_bg${i}_cob.mp4"
            OUTPUT="bg-compressed/video_bg${i}_cob.mp4"
            echo "Compressing video_bg${i}_cob.mp4 ..."
            ffmpeg -y \
              -i "$INPUT" \
              -c:v libx264 \
              -crf 28 \
              -preset slow \
              -vf "scale='min(1920,iw)':-2" \
              -movflags +faststart \
              -an \
              "$OUTPUT"
            BEFORE=$(du -sh "$INPUT"  | cut -f1)
            AFTER=$(du -sh "$OUTPUT" | cut -f1)
            echo "  → ${BEFORE} → ${AFTER}"
          done

      - name: Upload compressed videos to GitHub Release (tag: bg-videos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the old release/tag if it exists so we can recreate it fresh
          gh release delete bg-videos --yes 2>/dev/null || true
          git push origin --delete bg-videos 2>/dev/null || true

          gh release create bg-videos \
            --title "Background Videos (Compressed)" \
            --notes "Auto-generated by the compress-bg-videos workflow. 1080p H.264 CRF 28." \
            bg-compressed/video_bg1_cob.mp4 \
            bg-compressed/video_bg2_cob.mp4 \
            bg-compressed/video_bg3_cob.mp4
